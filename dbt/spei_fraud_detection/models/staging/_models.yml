version: 2

models:
  - name: stg_transactions
    description: SPEI transactions with fraud labels.
    columns:
      - name: transaction_id
        description: Unique transaction identifier.
        tests:
          - unique
          - not_null
      - name: sender_account_id
        description: Account that initiated the transaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: sender_clabe
        description: CLABE of the sender account.
      - name: receiver_account_id
        description: Account that received the transaction.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: receiver_clabe
        description: CLABE of the receiver account.
      - name: amount
        description: Transaction amount in MXN.
        tests:
          - not_null
      - name: transaction_date
        description: Timestamp of the transaction.
        tests:
          - not_null
      - name: concept_pago
        description: Free-text payment concept entered by the sender.
      - name: status
        description: Transaction state. Always 'Liquidada' in this dataset.
        tests:
          - accepted_values:
              arguments:
                values: ['Liquidada']
      - name: is_fraud
        description: True if the transaction is fraudulent.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: fraud_typology
        description: Fraud category when is_fraud is true, otherwise NULL.
        tests:
          - accepted_values:
              arguments:
                values: ['app_fraud', 'ato', 'mule_to_mule', 'smurfing', 'business_impersonation']
      - name: fraud_event_id
        description: Groups transactions belonging to the same fraud event. NULL for legitimate transactions.

  - name: stg_accounts
    description: Bank accounts with CLABE identifiers.
    columns:
      - name: account_id
        description: Unique account identifier.
        tests:
          - unique
          - not_null
      - name: person_id
        description: Identifier of the person who owns the account.
      - name: bank_code
        description: Three-digit code identifying the issuing bank.
      - name: plaza_code
        description: Three-digit code identifying the account's plaza (branch region).
      - name: account_number
        description: Account number within the bank.
      - name: clabe
        description: 18-digit CLABE following Banxico standard.
        tests:
          - unique
          - not_null
      - name: kyc_tier
        description: KYC classification tier (1 lightest, 4 highest).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false
      - name: creation_date
        description: Date the account was created.
        tests:
          - not_null
      - name: phone_number
        description: Phone number associated with the account.
      - name: activity_segment
        description: Expected activity level for this account.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['dormant', 'light', 'regular', 'heavy', 'power']
      - name: mule_type
        description: Mule classification for accounts flagged in fraud generation. NULL for non-mule accounts.