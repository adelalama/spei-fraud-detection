version: 2

models:
  - name: stg_transactions
    description: Spei transactions with fraud labels
    columns:
      - name: transaction_id
        description: Identifier for each transaction
        tests:
          - unique
          - not_null
      - name: sender_account_id
        description: Clabe identifying sender account
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: receiver_account_id
        description: Clabe identifying receiver account
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_accounts')
                field: account_id
      - name: amount
        description: Transaction amount in MXN pesos
        tests:
          - not_null
      - name: transaction_date
        description: Date of transaction
        tests:
          - not_null
      - name: status
        description: State of transaction, 'Liquidada' by default
        tests:
          - accepted_values:
              arguments:
                values: ['Liquidada']
      - name: is_fraud
        description: Boolean fraud label
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
                quote: false
      - name: fraud_typology
        description: Type of fraud in transaction
        tests:
          - accepted_values:
              arguments:
                values: ['app_fraud', 'ato', 'mule_to_mule', 'smurfing', 'business_impersonation']

  - name: stg_accounts
    description: Bank accounts with unique Clabe identifiers
    columns:
      - name: account_id
        description: unique identifier per account
        tests:
          - unique
          - not_null
      - name: clabe
        description: Unique Clabe generated in accordance to Banxico standard
        tests:
          - unique
          - not_null
      - name: kyc_tier
        description: Client categorization
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false
      - name: activity_segment
        description: Amount of activity the account has
        tests:
          - not_null
          - accepted_values:
              values: ['dormant', 'light', 'regular', 'heavy', 'power']
      - name: creation_date
        description: Date of account creation
        tests:
          - not_null